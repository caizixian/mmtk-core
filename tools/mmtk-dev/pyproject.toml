[project]
name = "mmtk-dev"
version = "0.1.0"
description = "MMTk performance tracking and regression detection tool"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "pyyaml>=6.0",
    "rich>=13.0",
    "httpx>=0.25",
    "running-ng>=0.4.7",
    "numpy>=1.24",
    "scipy>=1.10",
]

[dependency-groups]
dev = ["pytest>=7.0", "mypy>=1.8", "ruff>=0.4", "types-PyYAML>=6.0"]

[project.scripts]
mmtk-dev = "mmtk_dev.cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["running.*", "scipy.*", "numpy.*", "yaml.*", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
