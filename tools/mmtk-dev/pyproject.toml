[project]
name = "mmtk-dev"
version = "0.1.0"
description = "MMTk performance tracking and regression detection tool"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "pyyaml>=6.0",
    "rich>=13.0",
    "httpx>=0.25",
    "running-ng>=0.5.13",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.scripts]
mmtk-dev = "mmtk_dev.cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
